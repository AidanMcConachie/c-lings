[[exercises]]
name = "variables1"
dir = "01_variables"
test = false
hint = """
The declaration on that line is missing a type. Which type fits the
value 5? (Hint: it's the one printf's `%d` expects.)"""

[[exercises]]
name = "variables2"
dir = "01_variables"
test = false
hint = """
A const variable can't be assigned to, it can only be initialized. Instead
of assigning 42 afterwards, initialize `answer` with the right value and
remove the assignment."""

[[exercises]]
name = "variables3"
dir = "01_variables"
test = false
hint = """
`minutes` is declared inside the `if` block, so it doesn't exist after the
block's closing `}`. Move its declaration to a place where both uses can
see it."""

[[exercises]]
name = "variables4"
dir = "01_variables"
