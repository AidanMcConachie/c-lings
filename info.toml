format_version = 1

welcome_message = """
Is this your first time? Don't worry, c-lings is made for beginners!
We are going to teach you a lot of things about C, but before we can
get started, here are some notes about how c-lings operates:

1. The central concept behind c-lings is that you solve exercises. These
   exercises usually contain some compiler errors or failing tests, and
   it's your job to find the bug and fix it!
2. Make sure to have your editor open in the `exercises/` directory. Then,
   c-lings will show you the path of the current exercise under the progress
   bar. Open the exercise file in your editor, fix errors and save the file.
   c-lings will automatically detect the file change and rerun the exercise.
   If all errors are fixed, c-lings will ask you to move on to the next one.
3. Exercises are compiled with -Wall -Wextra -Werror: every warning is an
   error. That's on purpose, C compilers' warnings catch real bugs!
4. If you're stuck on an exercise, enter `h` to show a hint.
5. If an exercise doesn't make sense to you, read the README.md in its
   directory, and don't hesitate to look things up on cppreference.com."""

final_message = """
We hope you enjoyed learning about the various aspects of C!

If you noticed any issues, please don't hesitate to report them. Some ideas
for where to go next:

- Read "The C Programming Language" (K&R) or "Modern C" by Jens Gustedt
- Build something! A hex dump tool, a tiny shell, a hash table...
- Learn your tools: gdb, valgrind and -fsanitize=address,undefined
- Read the source of clings itself (it's written in C, of course)"""

